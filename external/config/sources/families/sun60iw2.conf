source "${BASH_SOURCE%/*}/include/sunxi64_common.inc"

LINUXFAMILY=sun60iw2
# The shared sunxi desktop list adds a Chinese input method. XFCE already has its fonts.
PACKAGE_LIST_DESKTOP_FAMILY=""

[[ -z $CPUMIN ]] && CPUMIN=416000
[[ -z $CPUMAX ]] && CPUMAX=2002000
# The A733 kernel default is schedutil. cpufrequtils must use the same governor.
GOVERNOR=schedutil

OFFSET=32
OVERLAY_PREFIX='sun60i-a733'
BOOTBRANCH='branch:v2018.05-sun60iw2'
UBOOT_COMPILER="arm-linux-gnueabi-"
UBOOT_USE_GCC='> 6.0'
BOOTENV_FILE='sun60iw2.txt'
BOOTSCRIPT='boot-sun60iw2.cmd:boot.cmd'
KERNEL_USE_GCC='> 10.0'
INITRD_ARCH=arm
UBOOT_TARGET_MAP=";;dts/${BOARD}-u-boot.dts boot0_sdcard.fex boot0_spinor_a733.fex boot0_ufs.fex boot_package.fex"
KERNELPATCHDIR=${BOARDFAMILY}-${BRANCH}
MAINLINE_UBOOT_SOURCE='https://gitee.com/orangepi-xunlong/u-boot-orangepi.git'

case $BRANCH in

	legacy)
		if [[ $GITEE_SERVER == yes ]]; then
			KERNELSOURCE="https://gitee.com/orangepi-xunlong/orange-pi-5.15-sun60iw2.git"
		else
			KERNELSOURCE="https://github.com/orangepi-xunlong/linux-orangepi.git"
		fi

		KERNELBRANCH="branch:orange-pi-5.15-sun60iw2"
		LINUXCONFIG="linux-sun60iw2-legacy-a733"

	;;

	current)
		if [[ $GITEE_SERVER == yes ]]; then
			KERNELSOURCE="https://gitee.com/orangepi-xunlong/orange-pi-6.6-sun60iw2.git"
		else
			KERNELSOURCE="https://github.com/orangepi-xunlong/linux-orangepi.git"
		fi

		KERNELBRANCH="branch:orange-pi-6.6-sun60iw2"
		LINUXCONFIG="linux-sun60iw2-current-a733"
	;;
esac

family_tweaks_s()
{
	# AIC8800D80 Bluetooth is UART HCI on ttyS1. The SDIO firmware leaves the
	# controller asleep until BT_WAKE is written, then hciattach registers hci0.
	# mtd-utils writes the bootloader to SPI flash from orangepi-config.
	if [[ ${BUILD_MINIMAL} != yes ]]; then
		chroot $SDCARD /bin/bash -c "DEBIAN_FRONTEND=noninteractive apt-get -y -qq install rfkill bluez mtd-utils" \
			|| exit_with_error "Bluetooth and SPI flash packages failed to install"

		local fwdir fwname
		if [[ -d "${LINUXSOURCEDIR}" ]]; then
			while IFS= read -r fwdir; do
				[[ -n "$(find "${fwdir}" -maxdepth 1 -name '*.bin' -print -quit)" ]] || continue
				fwname="$(basename "${fwdir}")"
				mkdir -p "${SDCARD}/lib/firmware/${fwname}"
				cp -a "${fwdir}/." "${SDCARD}/lib/firmware/${fwname}/"
			done < <(find "${LINUXSOURCEDIR}" -type d -name 'aic8800*' -print)
		fi

		cat > "${SDCARD}/etc/systemd/system/aic8800-bluetooth.service" << 'EOF'
[Unit]
Description=AIC8800 Bluetooth UART
After=bluetooth.service
Wants=bluetooth.service

[Service]
Type=simple
ExecStartPre=/usr/sbin/rfkill unblock bluetooth
ExecStartPre=/bin/sh -c 'i=0; while [ "$i" -lt 10 ] && [ ! -e /proc/bluetooth/sleep/btwrite ]; do i=$((i+1)); sleep 1; done; echo 1 > /proc/bluetooth/sleep/btwrite'
ExecStart=/usr/bin/hciattach -n -s 1500000 /dev/ttyS1 any 1500000 flow nosleep
Restart=on-failure
RestartSec=2

[Install]
WantedBy=multi-user.target
EOF
		chroot "${SDCARD}" /bin/bash -c "systemctl --no-reload enable bluetooth.service aic8800-bluetooth.service" \
			|| exit_with_error "Bluetooth service failed to enable"
	fi

	if [[ $BUILD_DESKTOP == yes ]]; then
		local chrome_deb="${EXTER}/cache/debs/arm64/google-chrome-stable_current_arm64.deb"
		mkdir -p "${EXTER}/cache/debs/arm64"
		wget -nc -P "${EXTER}/cache/debs/arm64/" https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb \
			>> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1
		[[ -f "${chrome_deb}" ]] || exit_with_error "Google Chrome download failed"
		install_deb_chroot "${chrome_deb}"

		local pulse_profiles="${SDCARD}/usr/share/pulseaudio/alsa-mixer/profile-sets/default.conf"
		[[ -f "${pulse_profiles}" ]] && sed -i "s/auto-profiles = yes/auto-profiles = no/" "${pulse_profiles}"

		# Auto-detect audio cards at first boot instead of hardcoding card numbers
		cat <<-'AUDIOSETUP' > ${SDCARD}/usr/lib/orangepi/orangepi-audio-setup
		#!/bin/bash
		PA_CONF=/etc/pulse/default.pa
		# Skip if already configured
		grep -q "HDMI-Playback" $PA_CONF 2>/dev/null && exit 0
		# Find HDMI card
		hdmi_card=$(aplay -l 2>/dev/null | grep -i "hdmi" | head -1 | grep -o "card [0-9]*" | awk '{print $2}')
		# Find a non-HDMI playback card (audio codec)
		codec_card=$(aplay -l 2>/dev/null | grep "card [0-9]*" | grep -iv "hdmi" | head -1 | grep -o "card [0-9]*" | awk '{print $2}')
		[[ -n $hdmi_card ]] && echo "load-module module-alsa-sink device=hw:${hdmi_card},0 sink_name=HDMI-Playback sink_properties=\"device.description='HDMI Audio'\"" >> $PA_CONF
		[[ -n $codec_card ]] && echo "load-module module-alsa-sink device=hw:${codec_card},0 sink_name=AudioCodec-Playback sink_properties=\"device.description='Audio Codec'\"" >> $PA_CONF
		[[ -n $hdmi_card || -n $codec_card ]] && pulseaudio -k 2>/dev/null || true
		exit 0
		AUDIOSETUP
		chmod +x ${SDCARD}/usr/lib/orangepi/orangepi-audio-setup
		# Run once at boot via a oneshot service
		cat <<-'AUDIOUNIT' > ${SDCARD}/etc/systemd/system/orangepi-audio-setup.service
		[Unit]
		Description=Orange Pi audio card detection
		After=pulseaudio.service
		[Service]
		Type=oneshot
		ExecStart=/usr/lib/orangepi/orangepi-audio-setup
		RemainAfterExit=yes
		[Install]
		WantedBy=multi-user.target
		AUDIOUNIT
		chroot ${SDCARD} /bin/bash -c "systemctl enable orangepi-audio-setup.service"

	fi

	if [[ ${BRANCH} == current ]]; then
		SERIALCON="ttyS0"
	fi

	if [[ $RELEASE == resolute && -f ${SDCARD}/lib/systemd/profile.d/80-systemd-osc-context.sh ]]; then
		sed -i '1a case "$(tty)" in /dev/ttyS*|/dev/ttyAMA*|/dev/ttyUSB*) return 0 ;; esac' ${SDCARD}/lib/systemd/profile.d/80-systemd-osc-context.sh
	fi

	rsync -a --chown=root:root \
		--exclude 'etc/adb_conf.sh' \
		--exclude 'etc/adb_profile' \
		--exclude 'usr/bin/adb_shell' \
		--exclude 'opt/' \
		--exclude 'usr/local/bin/test_camera.sh' \
		"${EXTER}"/packages/bsp/sun60iw2/ ${SDCARD}/

	# NPU runtime and the vpm_run test. The yolov5 demo is left out: its own libjpeg, libpng
	# and OpenCV copies in /usr/lib would take the place of the system ones.
	local npu="${EXTER}/cache/sources/sun60iw2_packages/npu"
	[[ -f "${npu}/usr/lib/libVIPhal.so" ]] || exit_with_error "NPU runtime is missing" "${npu}"
	rsync -a --chown=root:root \
		--include 'usr/' --include 'usr/include/***' \
		--include 'usr/lib/' --include 'usr/lib/libVIPhal.so' --include 'usr/lib/libNBGlinker.so' \
		--include 'opt/' --include 'opt/vpm_run/***' \
		--exclude '*' \
		"${npu}/" "${SDCARD}/"
	chroot "${SDCARD}" /bin/bash -c "ldconfig" || exit_with_error "ldconfig failed"

	# Video engine: libcedarc drives the H.264/H.265 encoder and the decoders. GStreamer reaches
	# them through Allwinner's OMX plugin, which exposes H.264 and MJPEG encoding only.
	local video="${EXTER}/cache/sources/sun60iw2_packages/bullseye"
	[[ -d "${video}/libcedarc" ]] || exit_with_error "Video engine libraries are missing" "${video}/libcedarc"
	dpkg_install_debs_chroot "${video}/libcedarc"
	[[ -f $SDCARD/etc/cedarc.conf ]] && sed -i 's/enable_scaledown_while_4k = 1/enable_scaledown_while_4k = 0/' $SDCARD/etc/cedarc.conf
	if [[ $BUILD_MINIMAL != yes ]]; then
		run_on_sdcard "DEBIAN_FRONTEND=noninteractive apt-get -y -qq install gstreamer1.0-tools \
			gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad" \
			|| exit_with_error "GStreamer failed to install"
		if [[ $BUILD_DESKTOP == yes ]]; then
			run_on_sdcard "DEBIAN_FRONTEND=noninteractive apt-get -y -qq install gstreamer1.0-x gstreamer1.0-alsa" \
				|| exit_with_error "GStreamer failed to install"
		fi
		dpkg_install_debs_chroot "${video}/gst-omx-generic1.0"
		[[ $RELEASE == bullseye ]] && dpkg_install_debs_chroot "${video}/gstreamer1.0-plugins-good"
	fi

	# PowerVR libraries, firmware and kernel module. Orange Pi publishes them in one Debian 11
	# package that also replaces Xorg. A console image uses the libraries for compute.
	# A desktop takes it only on the releases where Orange Pi ships it.
	if [[ $BUILD_DESKTOP != yes || $RELEASE =~ ^(bullseye|resolute|trixie)$ ]]; then
		local packages="${EXTER}/cache/sources/sun60iw2_packages"
		local xserver_deb="${packages}/bullseye/xserver/xserver-xorg-img-bxm_1.21.1-2_arm64.deb"
		local ko="${SRC}/.tmp/gpu_modules_sun60iw2/pvrsrvkm.ko"
		local environment version
		[[ -f "${xserver_deb}" ]] || exit_with_error "PowerVR package is missing" "${xserver_deb}"
		[[ -f "${ko}" ]] || exit_with_error "PowerVR kernel module was not built" "pvrsrvkm.ko"

		# The deb declares no dependencies. These are the libraries its blobs link to.
		run_on_sdcard "DEBIAN_FRONTEND=noninteractive apt-get -y -qq install clinfo vulkan-tools \
			libdrm2 libexpat1 zlib1g libudev1 libx11-6 libx11-xcb1 libxcb1 libxcb-dri2-0 libxcb-dri3-0 \
			libxcb-present0 libxcb-randr0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxshmfence1" \
			|| exit_with_error "PowerVR libraries failed to install"

		# This Xorg is linked to libcrypto.so.1.1. Releases after bullseye have OpenSSL 3 only.
		if [[ $BUILD_DESKTOP == yes && $RELEASE != bullseye ]]; then
			local ssl_deb="${EXTER}/cache/debs/arm64/libssl1.1_1.1.1w-0+deb11u1_arm64.deb"
			mkdir -p "${EXTER}/cache/debs/arm64"
			if [[ ! -f "${ssl_deb}" ]]; then
				wget -O "${ssl_deb}" "https://deb.debian.org/debian/pool/main/o/openssl/libssl1.1_1.1.1w-0+deb11u1_arm64.deb" \
					>> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1 \
					|| exit_with_error "OpenSSL 1.1 download failed" "libssl1.1"
			fi
			dpkg_install_deb_chroot "${ssl_deb}"
		fi

		# The deb replaces /etc/environment with a shell export that pam_env ignores, and PATH
		# goes with it. Its lightdm.service and 00-pvr-priority.conf already point at /usr/local/lib.
		environment=$(cat "${SDCARD}/etc/environment" 2>/dev/null)
		cp -f "${xserver_deb}" "${SDCARD}/xserver-xorg-img-bxm_1.21.1-2_arm64.deb"
		chroot "${SDCARD}" /bin/bash -c "dpkg -i --force-overwrite /xserver-xorg-img-bxm_1.21.1-2_arm64.deb" \
			>> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1 \
			|| exit_with_error "PowerVR package failed to install" "${xserver_deb}"
		rm -f "${SDCARD}/xserver-xorg-img-bxm_1.21.1-2_arm64.deb"
		printf '%s\n' "${environment}" > "${SDCARD}/etc/environment"
		chroot "${SDCARD}" /bin/bash -c "ldconfig" || exit_with_error "ldconfig failed"

		version=$(grab_version "$LINUXSOURCEDIR")
		install -m 755 -d $SDCARD/lib/modules/$version-$BOARDFAMILY/extra
		install -m 644 "${ko}" $SDCARD/lib/modules/$version-$BOARDFAMILY/extra
		depmod -b $SDCARD $version-$BOARDFAMILY
		echo pvrsrvkm > "${SDCARD}/etc/modules-load.d/pvrsrvkm.conf"

		if [[ $BUILD_DESKTOP == yes ]]; then
			# Same session settings as Orange Pi. GTK4's GL renderer crashes this X driver.
			if [[ $RELEASE == bullseye ]]; then
				echo 'QT_XCB_GL_INTEGRATION=none' >> "${SDCARD}/etc/environment"
			else
				echo 'GSK_RENDERER=cairo' >> "${SDCARD}/etc/environment"
			fi
			# An xserver-xorg-core upgrade would put back the stock Xorg and modesetting driver.
			chroot "${SDCARD}" /bin/bash -c "apt-mark hold xserver-xorg-core" \
				>> "${DEST}"/${LOG_SUBPATH}/install.log 2>&1 \
				|| exit_with_error "xserver-xorg-core hold failed"
			# The sunxi-drm hardware cursor plane flickers on every move; X draws the cursor itself instead.
			local xorg_conf="${SDCARD}/etc/X11/xorg.conf.d/20-modesetting.conf"
			sed -i '/Identifier[[:space:]]*"Allwinner Graphics"/a\    Option "SWcursor" "true"' "${xorg_conf}"
			grep -q '"SWcursor"' "${xorg_conf}" || exit_with_error "SWcursor option missing" "${xorg_conf}"

			# Orange Pi's Chrome flags: WebGL and compositing through ANGLE on the PowerVR Vulkan driver.
			local chrome_launcher="${SDCARD}/opt/google/chrome/google-chrome"
			sed -i 's|exec -a "$0" "$HERE/chrome" "$@"|exec -a "$0" "$HERE/chrome" --use-gl=angle --use-angle=vulkan --enable-features=Vulkan,VulkanFromANGLE --ignore-gpu-blocklist "$@"|' "${chrome_launcher}"
			grep -q -- '--use-angle=vulkan' "${chrome_launcher}" || exit_with_error "Chrome launcher was not patched" "${chrome_launcher}"
		fi
	fi
}

uboot_custom_postprocess()
{

	if [[ ${BRANCH} =~ legacy|current && $(dpkg --print-architecture) == amd64 ]]; then

		local BIN_PATH="${EXTER}/packages/pack-uboot/${BOARDFAMILY}/bin"
		local tools="${EXTER}/packages/pack-uboot/tools"
		local tool
		[[ -f "${BIN_PATH}/boot0_sdcard_a733.fex" && -f "${BIN_PATH}/boot0_ufs_a733.fex" && -f "${BIN_PATH}/boot0_spinor_a733.fex" ]] \
			|| exit_with_error "A733 boot0 is missing" "${BIN_PATH}"
		for tool in dtc script update_dtb update_uboot dragonsecboot; do
			[[ -f "${tools}/${tool}" ]] || exit_with_error "U-boot pack tool is missing" "${tool}"
			chmod +x "${tools}/${tool}"
		done
		rm -rf dts/*.dts sys_config "${BOARD}-u-boot-current.dtb"
		export PATH=${EXTER}/packages/pack-uboot/tools/:$PATH
		cp ${EXTER}/packages/pack-uboot/${BOARDFAMILY}/bin/* . -r
		cp "${BIN_PATH}/boot0_sdcard_a733.fex" ./boot0_sdcard.fex
		cp "${BIN_PATH}/boot0_ufs_a733.fex" ./boot0_ufs.fex
		cp "${BIN_PATH}/boot0_spinor_a733.fex" ./boot0_spinor_a733.fex

		cp sys_config/sys_config.fex sys_config.fex
		cp u-boot.bin u-boot.fex
		cp dts/u-boot-current.dts dts/${BOARD}-u-boot.dts

		# make u-boot dtb
		$EXTER/packages/pack-uboot/tools/dtc -p 2048 -W no-unit_address_vs_reg -@ -O dtb -o ${BOARD}-u-boot.dtb -b 0 dts/u-boot-current.dts
		[[ ! -f ${BOARD}-u-boot.dtb ]] && exit_with_error "dts compilation failed"

		busybox unix2dos sys_config.fex 2>/dev/null || sed -i 's/\r$//;s/$/\r/' sys_config.fex
		$EXTER/packages/pack-uboot/tools/script sys_config.fex
		cp ${BOARD}-u-boot.dtb sunxi.fex
		$EXTER/packages/pack-uboot/tools/update_dtb sunxi.fex 4096

		$EXTER/packages/pack-uboot/tools/update_uboot -no_merge u-boot.fex sys_config.bin
		update_uboot -no_merge u-boot.bin sys_config.bin

		#pack boot package
		busybox unix2dos boot_package.cfg 2>/dev/null || sed -i 's/\r$//;s/$/\r/' boot_package.cfg
		$EXTER/packages/pack-uboot/tools/dragonsecboot -pack boot_package.cfg

		if [[ ${MERGE_UBOOT} == yes ]]; then

			display_alert "Merge u-boot" "u-boot-${BOARD}-merged.bin" "info"
			dd if=/dev/zero of=u-boot-${BOARD}-merged.bin bs=1M count=20
			dd if=boot0_sdcard.fex of=u-boot-${BOARD}-merged.bin bs=8k seek=1 conv=fsync
			dd if=boot_package.fex of=u-boot-${BOARD}-merged.bin bs=8k seek=2050 conv=fsync
			mv u-boot-${BOARD}-merged.bin ${DEB_STORAGE}/u-boot/
		fi
	fi
}

write_uboot_platform_mtd()
{
	if [[ -b /dev/mtdblock0 ]]; then
		flash_erase /dev/mtd0 0 50
		size=$(stat --format="%s" $1/boot0_spinor_a733.fex)
		mtd_debug write /dev/mtd0 0 $size $1/boot0_spinor_a733.fex
		size=$(stat --format="%s" $1/boot_package.fex)
		mtd_debug write /dev/mtd0 262144 $size $1/boot_package.fex
		sync
	fi
}

write_uboot_platform_ufs()
{
        if [[ -f $1/boot0_ufs.fex ]]; then
                dd if=$1/boot0_ufs.fex of=$2 seek=16 conv=notrunc status=none >/dev/null 2>&1
                dd if=$1/boot_package.fex of=$2 seek=32800 conv=notrunc status=none >/dev/null 2>&1
        else
                echo "UFS u-boot image not found!"
                exit 1
        fi
}

